<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="48" fill="url(#bgA)"/>

  <!-- Book - open pages -->
  <g transform="translate(200,230)">
    <!-- Left page -->
    <path d="M-8,-60 L-80,-55 L-82,40 L-8,45 Z" fill="none" stroke="#e8e8e8" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M8,-60 L80,-55 L82,40 L8,45 Z" fill="none" stroke="#e8e8e8" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Spine -->
    <line x1="0" y1="-62" x2="0" y2="46" stroke="#e8e8e8" stroke-width="4"/>
    <!-- Text lines left -->
    <line x1="-70" y1="-30" x2="-18" y2="-30" stroke="#4a9eff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="-68" y1="-10" x2="-20" y2="-10" stroke="#4a9eff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="-66" y1="10" x2="-22" y2="10" stroke="#4a9eff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- Text lines right -->
    <line x1="18" y1="-30" x2="70" y2="-30" stroke="#4a9eff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="20" y1="-10" x2="68" y2="-10" stroke="#4a9eff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="22" y1="10" x2="66" y2="10" stroke="#4a9eff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Eye above the book -->
  <g transform="translate(200,130)">
    <!-- Eye outline -->
    <path d="M-55,0 Q0,-40 55,0 Q0,40 -55,0 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    <!-- Iris -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#4a9eff" stroke-width="3.5"/>
    <!-- Pupil -->
    <circle cx="0" cy="0" r="8" fill="#4a9eff"/>
    <!-- Highlight -->
    <circle cx="-4" cy="-4" r="3" fill="#ffffff" opacity="0.9"/>
    <!-- Light rays from eye -->
    <line x1="0" y1="-45" x2="0" y2="-58" stroke="#4a9eff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="-20" y1="-40" x2="-28" y2="-50" stroke="#4a9eff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="20" y1="-40" x2="28" y2="-50" stroke="#4a9eff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Brand name -->
  <text x="200" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#ffffff" letter-spacing="2">悦读助手</text>
  <text x="200" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4a9eff" letter-spacing="4" opacity="0.8">WEREAD PLUS</text>
</svg>