<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="48" fill="url(#bgC)"/>

  <!-- Subtle border -->
  <rect x="2" y="2" width="396" height="396" rx="47" fill="none" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Main mark: Stylized book forming an "R" shape -->
  <g transform="translate(200,175)">
    <!-- Book spine (vertical bar of R) -->
    <rect x="-50" y="-70" width="14" height="140" rx="4" fill="#1a1a2e"/>

    <!-- Top horizontal (top of R) -->
    <rect x="-50" y="-70" width="65" height="14" rx="4" fill="#1a1a2e"/>

    <!-- Bowl of R (right side, like a page curling) -->
    <path d="M15,-70 Q55,-70 55,-30 Q55,5 15,5" fill="none" stroke="#1a1a2e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Leg of R (diagonal, like a bookmark ribbon) -->
    <line x1="15" y1="5" x2="55" y2="70" stroke="#e63946" stroke-width="12" stroke-linecap="round"/>

    <!-- Plus sign integrated as a sparkle/delight marker -->
    <g transform="translate(70,-40)">
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#e63946" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#e63946" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Brand name -->
  <text x="200" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#1a1a2e" letter-spacing="3">WEREAD+</text>
  <text x="200" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#e63946" letter-spacing="6" font-weight="400">悦读助手</text>

  <!-- Subtle bottom accent line -->
  <line x1="140" y1="365" x2="260" y2="365" stroke="#e63946" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>